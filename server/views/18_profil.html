<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Homeschooling Flexa Cendekia | Profil</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #EAEDE2;
            font-family: 'JetBrains Mono', sans-serif;
            color: #17223B;
            margin: 0;
        }
        .spinner {
            border: 4px solid rgba(23, 34, 59, 0.1);
            border-left-color: #17223B;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
        <!-- Anti-Caret Cursor & Interaction Polish -->
    <style id="anti-caret-style">
        /* 1. Hilangkan garis kursor ketik berkedip (caret) di area non-input */
        *:not(input):not(textarea):not([contenteditable="true"]) {
            caret-color: transparent !important;
        }
        input, textarea, [contenteditable="true"] {
            caret-color: auto !important;
        }

        /* 2. Kursor default di seluruh area non-input (bukan I-beam text cursor) */
        body, div, section, article, aside, nav, header, footer,
        h1, h2, h3, h4, h5, h6, p, span, li, td, th, label,
        .card, .sidebar, .navbar, .ledger-card, .academic-ledger-card {
            cursor: default;
        }

        /* 3. Elemen interaktif tetap memakai kursor pointer */
        button, a, [role="button"], .btn, .clickable, .role-chip,
        input[type="submit"], input[type="button"], input[type="reset"] {
            cursor: pointer !important;
        }
        button *, a *, [role="button"] * {
            cursor: pointer !important;
        }

        /* 4. Hanya form input/textarea yang menampilkan kursor ketik */
        input[type="text"], input[type="email"], input[type="password"],
        input[type="number"], input[type="search"], input[type="tel"],
        input[type="url"], input:not([type]), textarea, select,
        [contenteditable="true"] {
            cursor: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            user-select: text !important;
        }

        /* 5. Mencegah teks terblok/terseleksi sembarangan pada elemen tombol & navigasi */
        button, a, .btn, nav, header, aside, .sidebar, .navbar, [role="button"], .role-chip {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        /* 6. Feedback visual klik (:active) dan status disabled */
        button:active, a:active, [role="button"]:active {
            transform: scale(0.985);
            transition: transform 0.05s ease-in-out;
        }
        button:disabled, button[disabled], .disabled {
            cursor: not-allowed !important;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body><h2 style="font-weight: bold; font-size: 1.2rem;">Mengarahkan ke Profil...</h2>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script>
        (function() {
            const LOGIN_URL = '/?page=01_login';
            const ROLE_TO_PAGE = {
                'Siswa': '/?page=18_profil_profil-siswa',
                'Guru': '/?page=18_profil_profil-guru',
                'OrangTua': '/?page=18_profil_profil-ortu'
            };

            // Fast redirect from local cache (Zero delay)
            try {
                const raw = localStorage.getItem('currentUser');
                if (raw) {
                    const u = JSON.parse(raw);
                    const r = u.role ? u.role.toString().trim().toLowerCase().replace(/[\s_-]/g, '') : 'siswa';
                    if (r === 'guru') { window.location.replace(ROLE_TO_PAGE['Guru']); return; }
                    if (r === 'orangtua' || r === 'ortu') { window.location.replace(ROLE_TO_PAGE['OrangTua']); return; }
                    window.location.replace(ROLE_TO_PAGE['Siswa']);
                    return;
                }
            } catch(e) {}

            function waitForFirebase(cb) {
                if (window.firebaseAuth) { cb(); }
                else { window.addEventListener('firebase-ready', cb); }
            }

            waitForFirebase(function() {
                window.firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                    .then(function() {
                        var sudahDicekSekali = false;

                        firebaseAuth.onAuthStateChanged(function(user) {
                            if (!user) {
                                if (!sudahDicekSekali) {
                                    sudahDicekSekali = true;
                                    setTimeout(function() {
                                        if (!window.firebaseAuth.currentUser) {
                                            window.location.replace(LOGIN_URL);
                                        }
                                    }, 1000);
                                    return;
                                }
                                window.location.replace(LOGIN_URL);
                                return;
                            }
                            firebaseDb.collection('users').doc(user.uid).get()
                                .then(function(doc) {
                                    if (!doc.exists) {
                                        window.location.replace(LOGIN_URL);
                                        return;
                                    }
                                    function normalizeRole(role) {
                                        if (!role) return 'Siswa';
                                        var r = role.toString().trim().toLowerCase().replace(/[\s_-]/g, '');
                                        if (r === 'guru' || r === 'teacher') return 'Guru';
                                        if (r === 'orangtua' || r === 'ortu' || r === 'parent') return 'OrangTua';
                                        return 'Siswa';
                                    }
                                    const role = normalizeRole(doc.data().role);
                                    const target = ROLE_TO_PAGE[role] || ROLE_TO_PAGE['Siswa'];
                                    window.location.replace(target);
                                })
                                .catch(function() {
                                    window.location.replace(LOGIN_URL);
                                });
                        });
                    })
                    .catch(function() {
                        window.location.replace(LOGIN_URL);
                    });
            });

            // Fail-closed: 8s timeout
            setTimeout(function() {
                window.location.replace(LOGIN_URL);
            }, 8000);
        })();
    </script>
</body>
</html>
