<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Flexa Cendekia | Profil</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #EAEDE2;
            font-family: 'JetBrains Mono', sans-serif;
            color: #17223B;
            margin: 0;
        }
        .spinner {
            border: 4px solid rgba(23, 34, 59, 0.1);
            border-left-color: #17223B;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body><h2 style="font-weight: bold; font-size: 1.2rem;">Mengarahkan ke Profil...</h2>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script>
        (function() {
            const LOGIN_URL = '/?page=01_login';
            const ROLE_TO_PAGE = {
                'Siswa': '/?page=18_profil_profil-siswa',
                'Guru': '/?page=18_profil_profil-guru',
                'OrangTua': '/?page=18_profil_profil-ortu'
            };

            function waitForFirebase(cb) {
                if (window.firebaseAuth) { cb(); }
                else { window.addEventListener('firebase-ready', cb); }
            }

            waitForFirebase(function() {
                window.firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                    .then(function() {
                        var sudahDicekSekali = false;

                        firebaseAuth.onAuthStateChanged(function(user) {
                            if (!user) {
                                if (!sudahDicekSekali) {
                                    sudahDicekSekali = true;
                                    setTimeout(function() {
                                        if (!window.firebaseAuth.currentUser) {
                                            window.location.replace(LOGIN_URL);
                                        }
                                    }, 1000);
                                    return;
                                }
                                window.location.replace(LOGIN_URL);
                                return;
                            }
                            firebaseDb.collection('users').doc(user.uid).get()
                                .then(function(doc) {
                                    if (!doc.exists) {
                                        window.location.replace(LOGIN_URL);
                                        return;
                                    }
                                    const role = doc.data().role;
                                    const target = ROLE_TO_PAGE[role];
                                    if (target) {
                                        window.location.replace(target);
                                    } else {
                                        window.location.replace(LOGIN_URL);
                                    }
                                })
                                .catch(function() {
                                    window.location.replace(LOGIN_URL);
                                });
                        });
                    })
                    .catch(function() {
                        window.location.replace(LOGIN_URL);
                    });
            });

            // Fail-closed: 8s timeout
            setTimeout(function() {
                window.location.replace(LOGIN_URL);
            }, 8000);
        })();
    </script>
</body>
</html>
