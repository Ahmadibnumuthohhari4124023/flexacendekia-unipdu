<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Milestones Pencapaian | Flexa Cendekia</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&amp;family=Libre+Franklin:ital,wght@0,100..900;1,100..900&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#020b24",
                        "primary-container": "#17223b",
                        "secondary": "#805600",
                        "secondary-container": "#fdc265",
                        "surface": "#fbf8fb",
                        "surface-container": "#f0edf0",
                        "on-surface": "#1b1b1d",
                        "on-surface-variant": "#45464d",
                        "outline-variant": "#c6c6ce",
                        "on-secondary-container": "#754e00"
                    },
                    fontFamily: {
                        "display": ['"Source Serif 4"'],
                        "body": ["Libre Franklin"],
                        "mono": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
    <style>
        .blueprint-grid {
            background-image: 
                linear-gradient(rgba(23, 34, 59, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 34, 59, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .hard-shadow { box-shadow: 4px 4px 0px 0px #020b24; }
        .milestone-card { opacity: 0; transform: translateY(20px) scale(0.97); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .milestone-card.visible { opacity: 1; transform: translateY(0) scale(1); }
        .check-bounce { animation: checkBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes checkBounce { 0% { transform: scale(0.5); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .confetti { position: fixed; pointer-events: none; z-index: 100; }
    </style>

    
    <!-- Firebase SDK & Auth Layer -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/firebase-auth-guard.js"></script>
    <script src="/firebase-data-store.js"></script>
    <script src="/notification-sync.js"></script>
    <script src="/career-roadmap-data.js"></script>
</head>
<body class="bg-[#EAEDE2] text-on-surface font-body blueprint-grid min-h-screen">

    <!-- TopNavBar -->
    <nav class="fixed top-0 w-full bg-surface z-50 border-b border-on-surface/20 flex justify-between items-center h-16 px-4 md:px-8">
        <div class="flex items-center gap-4">
            <span class="font-display font-bold text-2xl text-primary">Flexa Cendekia</span>
        </div>
        <div class="flex items-center gap-6">
            <!-- Progress Counter -->
            <div class="hidden sm:flex items-center gap-2 bg-secondary-container/20 border border-secondary/30 px-3 py-1.5 rounded-full">
                <span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">trophy</span>
                <span class="font-mono text-[11px] text-secondary font-bold" id="progress-counter">0/0 Selesai</span>
            </div>
            <a href="/?page=07_hasil-roadmap" class="flex items-center gap-2 text-sm font-semibold text-primary hover:text-secondary transition-colors">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Kembali ke Roadmap
            </a>
        
                <!-- Logout Button -->
                <button onclick="if(window.flexaLogout) flexaLogout(); else if(window.firebase) firebase.auth().signOut().then(()=>if(window.flexaLogout) flexaLogout(); else window.location.href='/?page=01_login');" class="ml-2 flex items-center justify-center p-2 text-error hover:bg-error/10 rounded-full transition-colors group relative" title="Keluar">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="absolute -bottom-8 left-1/2 -translate-x-1/2 text-[10px] font-bold bg-surface text-on-surface px-2 py-1 shadow-md rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity border border-on-surface/10">Keluar</span>
                </button>
            </div>
    </nav>
    
    <main class="pt-24 pb-16 px-4 md:px-8 max-w-5xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-secondary-container/30 border border-secondary rounded-full mb-4">
                <span class="material-symbols-outlined text-secondary text-sm">auto_awesome</span>
                <span class="font-mono text-[11px] text-secondary font-bold tracking-widest uppercase">AI-Generated Milestones</span>
            </div>
            <h1 class="font-display font-bold text-4xl md:text-5xl text-primary mb-3" id="page-title">Pencapaian (Milestones)</h1>
            <p class="text-on-surface-variant max-w-xl mx-auto" id="page-subtitle">Tandai setiap pencapaian yang telah Anda raih dalam perjalanan menuju profesi impian.</p>
        </div>

        <!-- Progress Bar -->
        <div class="bg-white border border-primary/15 p-5 hard-shadow mb-10">
            <div class="flex items-center justify-between mb-3">
                <span class="font-mono text-[11px] text-on-surface-variant font-bold tracking-widest uppercase">Progress Keseluruhan</span>
                <span class="font-mono text-sm text-secondary font-bold" id="progress-percent">0%</span>
            </div>
            <div class="w-full h-3 bg-primary/5 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-secondary to-amber-400 rounded-full transition-all duration-700 ease-out" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Milestones Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="milestones-container">
            <!-- Items will be rendered by JS -->
        </div>
    </main>

    <script>
    let activeMilestones = [];

    function toggleMilestone(id) {
        const isChecked = localStorage.getItem('milestone_' + id) === 'true';
        localStorage.setItem('milestone_' + id, !isChecked);
        renderMilestonesUI();
        
        if (!isChecked) {
            const card = document.getElementById('card-' + id);
            if (card) {
                const icon = card.querySelector('.check-icon');
                if (icon) icon.classList.add('check-bounce');
                setTimeout(() => { if (icon) icon.classList.remove('check-bounce'); }, 500);
            }
            if (window.NotificationSync) {
                window.NotificationSync.addNotification('siswa', 'Milestone Tercapai!', 'Selamat! Kamu telah menyelesaikan satu milestone pencapaian.');
            }
        }
    }

    function renderMilestonesUI() {
        const container = document.getElementById('milestones-container');
        if (!container || !activeMilestones.length) return;

        let completed = 0;
        let html = '';

        activeMilestones.forEach(m => {
            const done = localStorage.getItem('milestone_' + m.id) === 'true';
            if (done) completed++;

            html += `
            <div id="card-${m.id}" onclick="toggleMilestone('${m.id}')" class="milestone-card border ${done ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-primary/15'} p-6 hard-shadow cursor-pointer hover:translate-y-[-2px] hover:shadow-[6px_6px_0_0_#020b24] transition-all duration-300 relative group flex flex-col justify-between">
                <!-- Check Button -->
                <div class="absolute top-4 right-4">
                    <span class="material-symbols-outlined check-icon ${done ? 'text-emerald-500' : 'text-primary/20'} text-2xl transition-colors" style="${done ? "font-variation-settings: 'FILL' 1;" : ''}">${done ? 'check_circle' : 'radio_button_unchecked'}</span>
                </div>
                
                <div>
                    <!-- Icon -->
                    <div class="w-12 h-12 rounded-lg ${done ? 'bg-emerald-500 text-white' : 'bg-primary/5 text-primary'} flex items-center justify-center mb-4 transition-colors">
                        <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">${m.icon || 'emoji_events'}</span>
                    </div>
                    
                    <!-- Content -->
                    <h3 class="font-bold text-lg ${done ? 'line-through text-on-surface-variant' : 'text-primary'} mb-2 pr-8 transition-colors">${m.title}</h3>
                    <p class="text-on-surface-variant text-sm mb-4 leading-relaxed">${m.desc}</p>
                </div>
                
                <!-- Target Badge -->
                <div class="flex items-center gap-2 mt-auto pt-3 border-t border-primary/10">
                    <span class="material-symbols-outlined text-secondary text-sm">schedule</span>
                    <span class="font-mono text-[11px] text-secondary font-bold tracking-wider">${m.target}</span>
                </div>
            </div>`;
        });

        container.innerHTML = html;

        const total = activeMilestones.length;
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
        const counterEl = document.getElementById('progress-counter');
        const percentEl = document.getElementById('progress-percent');
        const barEl = document.getElementById('progress-bar');

        if (counterEl) counterEl.textContent = completed + '/' + total + ' Selesai';
        if (percentEl) percentEl.textContent = pct + '%';
        if (barEl) barEl.style.width = pct + '%';

        // Animate cards
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        container.querySelectorAll('.milestone-card').forEach(card => observer.observe(card));
    }

    function applyMilestones(careerTitle, jenjang, kelas) {
        const store = window.CareerRoadmapStore;
        if (!store) return;

        const roadmap = store.getCareerRoadmap(careerTitle, jenjang, kelas);
        activeMilestones = roadmap.milestones || [];

        document.title = `Milestones: Jalur ${roadmap.title} | Flexa Cendekia`;
        
        const elTitle = document.getElementById('page-title');
        if (elTitle) elTitle.textContent = 'Milestones: Jalur ' + roadmap.title;

        const elSubtitle = document.getElementById('page-subtitle');
        if (elSubtitle) elSubtitle.textContent = 'Tandai setiap pencapaian yang telah Anda raih dalam perjalanan menjadi ' + roadmap.title + ' profesional.';

        renderMilestonesUI();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const careerTitle = localStorage.getItem('selectedCareer') || 'Arsitek';
        applyMilestones(careerTitle);
    });

    window.addEventListener('auth-ready', function(e) {
        const user = e.detail;
        if (user) {
            const careerFromDb = user.citaCita || localStorage.getItem('selectedCareer') || 'Arsitek';
            localStorage.setItem('selectedCareer', careerFromDb);
            applyMilestones(careerFromDb, user.jenjang, user.kelas);
        }
    });
    </script>
</body>
</html>
