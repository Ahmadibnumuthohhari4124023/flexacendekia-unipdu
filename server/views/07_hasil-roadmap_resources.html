<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Bahan Belajar | Homeschooling Flexa Cendekia</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&amp;family=Libre+Franklin:ital,wght@0,100..900;1,100..900&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#020b24",
                        "primary-container": "#17223b",
                        "secondary": "#805600",
                        "secondary-container": "#fdc265",
                        "surface": "#fbf8fb",
                        "surface-container": "#f0edf0",
                        "on-surface": "#1b1b1d",
                        "on-surface-variant": "#45464d",
                        "outline-variant": "#c6c6ce"
                    },
                    fontFamily: {
                        "display": ['"Source Serif 4"'],
                        "body": ["Libre Franklin"],
                        "mono": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
    <style>
        .blueprint-grid {
            background-image: 
                linear-gradient(rgba(23, 34, 59, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 34, 59, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .hard-shadow { box-shadow: 4px 4px 0px 0px #020b24; }
        .resource-card { opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .resource-card.visible { opacity: 1; transform: translateY(0); }
        .filter-active { background-color: #020b24 !important; color: white !important; }
    </style>

    
    <!-- Firebase SDK & Auth Layer -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/firebase-auth-guard.js"></script>
    <script src="/firebase-data-store.js"></script>
    <script src="/notification-sync.js"></script>
    <script src="/career-roadmap-data.js"></script>
</head>
<body class="bg-[#EAEDE2] text-on-surface font-body blueprint-grid min-h-screen">

    <!-- TopNavBar -->
    <nav class="fixed top-0 w-full bg-[#FBFAF5] z-50 border-b border-primary/20 flex justify-between items-center h-16 px-4 md:px-8">
        <div class="flex items-center gap-3">
            <img src="/public/images/Logo_Flexa-removebg-preview.png" alt="Logo Flexa Cendekia" class="h-8 w-auto object-contain" />
            <div>
                <a href="/?page=08_dashboard-siswa" class="font-display font-bold text-base md:text-xl text-primary hover:opacity-90">
                    Homeschooling Flexa Cendekia
                </a>
                <span class="hidden sm:inline-block ml-2 text-[10px] font-mono px-2 py-0.5 bg-primary/10 text-primary border border-primary/20 rounded font-bold uppercase tracking-wider">
                    Powered by UNIPDU
                </span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="/?page=07_hasil-roadmap" class="flex items-center gap-2 text-sm font-semibold text-primary hover:text-secondary transition-colors">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Kembali ke Roadmap
            </a>
            <!-- Logout Button -->
            <button onclick="if(window.flexaLogout) flexaLogout(); else if(window.firebase) firebase.auth().signOut().then(()=>window.location.href='/?page=01_login');" class="ml-2 flex items-center justify-center p-2 text-error hover:bg-error/10 rounded-full transition-colors group relative" title="Keluar">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </nav>
    
    <main class="pt-24 pb-16 px-4 md:px-8 max-w-5xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-secondary-container/30 border border-secondary rounded-full mb-4">
                <span class="material-symbols-outlined text-secondary text-sm">auto_awesome</span>
                <span class="font-mono text-[11px] text-secondary font-bold tracking-widest uppercase">AI-Curated Resources</span>
            </div>
            <h1 class="font-display font-bold text-4xl md:text-5xl text-primary mb-3" id="page-title">Bahan Belajar</h1>
            <p class="text-on-surface-variant max-w-xl mx-auto" id="page-subtitle">Koleksi buku, kursus, dan tools pilihan AI untuk mendukung perjalanan Anda.</p>
        </div>

        <!-- Filter Tabs -->
        <div class="flex flex-wrap justify-center gap-2 mb-10">
            <button class="filter-btn filter-active px-4 py-2 border border-primary/20 text-sm font-bold rounded-full transition-all hover:bg-primary hover:text-white" data-type="all">Semua</button>
            <button class="filter-btn px-4 py-2 bg-white border border-primary/20 text-sm font-bold rounded-full transition-all hover:bg-primary hover:text-white" data-type="book">📚 Buku</button>
            <button class="filter-btn px-4 py-2 bg-white border border-primary/20 text-sm font-bold rounded-full transition-all hover:bg-primary hover:text-white" data-type="course">🎓 Kursus</button>
            <button class="filter-btn px-4 py-2 bg-white border border-primary/20 text-sm font-bold rounded-full transition-all hover:bg-primary hover:text-white" data-type="tool">🛠️ Tools</button>
        </div>

        <!-- Resources Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="resources-container">
            <!-- Items will be rendered by JS -->
        </div>
    </main>

    <script>
    let activeResources = [];
    let currentFilter = 'all';

    function renderResourcesUI() {
        const container = document.getElementById('resources-container');
        if (!container) return;

        const filtered = currentFilter === 'all' ? activeResources : activeResources.filter(r => r.type === currentFilter);

        if (!filtered.length) {
            container.innerHTML = '<p class="col-span-3 text-center py-12 text-on-surface-variant">Tidak ada bahan belajar di kategori ini.</p>';
            return;
        }

        const typeLabels = { book: '📚 Buku', course: '🎓 Kursus', tool: '🛠️ Tool' };

        let html = '';
        filtered.forEach(r => {
            html += `
            <div class="bg-white border border-primary/15 p-6 hard-shadow flex flex-col justify-between group hover:translate-y-[-2px] transition-all">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="font-mono text-[11px] bg-primary/5 text-primary px-2.5 py-1 rounded-full font-bold">${typeLabels[r.type] || r.type}</span>
                        <span class="material-symbols-outlined text-secondary text-2xl">${r.icon || 'menu_book'}</span>
                    </div>
                    <h3 class="font-bold text-primary text-lg mb-1 group-hover:text-secondary transition-colors">${r.title}</h3>
                    <p class="font-stats-sm text-xs text-secondary font-bold mb-3">${r.author}</p>
                    <p class="text-on-surface-variant text-xs leading-relaxed">${r.desc}</p>
                </div>
                <div class="mt-6 pt-4 border-t border-primary/10 flex items-center justify-between">
                    <span class="text-[11px] font-bold text-primary flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                        Akses Resource <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    </span>
                </div>
            </div>`;
        });

        container.innerHTML = html;
    }

    function applyResources(careerTitle, jenjang, kelas) {
        const store = window.CareerRoadmapStore;
        if (!store) return;

        const roadmap = store.getCareerRoadmap(careerTitle, jenjang, kelas);
        activeResources = roadmap.resources || [];

        document.title = `Bahan Belajar: ${roadmap.title} | Flexa Cendekia`;
        
        const elTitle = document.getElementById('page-title');
        if (elTitle) elTitle.textContent = 'Bahan Belajar: ' + roadmap.title;

        const elSubtitle = document.getElementById('page-subtitle');
        if (elSubtitle) elSubtitle.textContent = 'Rekomendasi buku, kursus, dan tools standar industri untuk mendalami ' + roadmap.title + '.';

        renderResourcesUI();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const careerTitle = localStorage.getItem('selectedCareer') || 'Arsitek';
        applyResources(careerTitle);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('filter-active', 'bg-primary', 'text-white');
                    b.classList.add('bg-white');
                });
                btn.classList.add('filter-active', 'bg-primary', 'text-white');
                btn.classList.remove('bg-white');
                currentFilter = btn.getAttribute('data-type');
                renderResourcesUI();
            });
        });
    });

    window.addEventListener('auth-ready', function(e) {
        const user = e.detail;
        if (user) {
            const careerFromDb = user.citaCita || localStorage.getItem('selectedCareer') || 'Arsitek';
            localStorage.setItem('selectedCareer', careerFromDb);
            applyResources(careerFromDb, user.jenjang, user.kelas);
        }
    });
    </script>
</body>
</html>
