    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {

                        "primary-container": "#17223b",
                        "secondary": "#805600",
                        "secondary-container": "#fdc265",
                        "surface": "#fbf8fb",
                        "surface-container": "#f0edf0",
                        "surface-container-low": "#f5f3f5",
                        "on-surface": "#1b1b1d",
                        "on-surface-variant": "#45464d",
                        "outline-variant": "#c6c6ce",
                        "on-secondary-container": "#754e00"
                    },
                    fontFamily: {
                        "display": ['"Source Serif 4"'],
                        "body": ["Libre Franklin"],
                        "mono": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
    <style>
        .blueprint-grid {
            background-image: 
                linear-gradient(rgba(23, 34, 59, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 34, 59, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .hard-shadow { box-shadow: 4px 4px 0px 0px #020b24; }
        .timeline-item { opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .timeline-item.visible { opacity: 1; transform: translateY(0); }
        .pulse-dot { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(128, 86, 0, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(128, 86, 0, 0); } }
    </style>

    
    <!-- Firebase SDK & Auth Layer -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/firebase-auth-guard.js"></script>
    <script src="/firebase-data-store.js"></script>
    <script src="/notification-sync.js"></script>
    <script src="/career-roadmap-data.js"></script>
        <!-- Anti-Caret Cursor & Interaction Polish -->
    <style id="anti-caret-style">
        /* 1. Hilangkan garis kursor ketik berkedip (caret) di area non-input */
        *:not(input):not(textarea):not([contenteditable="true"]) {
            caret-color: transparent !important;
        }
        input, textarea, [contenteditable="true"] {
            caret-color: auto !important;
        }

        /* 2. Kursor default di seluruh area non-input (bukan I-beam text cursor) */
        body, div, section, article, aside, nav, header, footer,
        h1, h2, h3, h4, h5, h6, p, span, li, td, th, label,
        .card, .sidebar, .navbar, .ledger-card, .academic-ledger-card {
            cursor: default;
        }

        /* 3. Elemen interaktif tetap memakai kursor pointer */
        button, a, [role="button"], .btn, .clickable, .role-chip,
        input[type="submit"], input[type="button"], input[type="reset"] {
            cursor: pointer !important;
        }
        button *, a *, [role="button"] * {
            cursor: pointer !important;
        }

        /* 4. Hanya form input/textarea yang menampilkan kursor ketik */
        input[type="text"], input[type="email"], input[type="password"],
        input[type="number"], input[type="search"], input[type="tel"],
        input[type="url"], input:not([type]), textarea, select,
        [contenteditable="true"] {
            cursor: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            user-select: text !important;
        }

        /* 5. Mencegah teks terblok/terseleksi sembarangan pada elemen tombol & navigasi */
        button, a, .btn, nav, header, aside, .sidebar, .navbar, [role="button"], .role-chip {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        /* 6. Feedback visual klik (:active) dan status disabled */
        button:active, a:active, [role="button"]:active {
            transform: scale(0.985);
            transition: transform 0.05s ease-in-out;
        }
        button:disabled, button[disabled], .disabled {
            cursor: not-allowed !important;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-[#EAEDE2] text-on-surface font-body blueprint-grid min-h-screen">

    <!-- TopNavBar -->
    <nav class="fixed top-0 w-full bg-[#FBFAF5] z-50 border-b border-primary/20 flex justify-between items-center h-16 px-4 md:px-8">
        <div class="flex items-center gap-3">
            <img src="/public/images/Logo_Flexa-removebg-preview.png" alt="Logo Flexa Cendekia" class="h-8 w-auto object-contain" />
            <div>
                <a href="/?page=08_dashboard-siswa" class="font-display font-bold text-base md:text-xl text-primary hover:opacity-90">
                    Homeschooling Flexa Cendekia
                </a>
                <span class="hidden sm:inline-block ml-2 text-[10px] font-mono px-2 py-0.5 bg-primary/10 text-primary border border-primary/20 rounded font-bold uppercase tracking-wider">
                    Powered by UNIPDU
                </span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="/?page=07_hasil-roadmap" class="flex items-center gap-2 text-sm font-semibold text-primary hover:text-secondary transition-colors">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Kembali ke Roadmap
            </a>
            <!-- Logout Button -->
            <button onclick="if(window.flexaLogout) flexaLogout(); else if(window.firebase) firebase.auth().signOut().then(()=>window.location.href='/?page=01_login');" class="ml-2 flex items-center justify-center p-2 text-error hover:bg-error/10 rounded-full transition-colors group relative" title="Keluar">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </nav>
    
    <main class="pt-24 pb-16 px-4 md:px-8 max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-secondary-container/30 border border-secondary rounded-full mb-4">
                <span class="material-symbols-outlined text-secondary text-sm">auto_awesome</span>
                <span class="font-mono text-[11px] text-secondary font-bold tracking-widest uppercase">AI-Generated Timeline</span>
            </div>
            <h1 class="font-display font-bold text-4xl md:text-5xl text-primary mb-3" id="page-title">Timeline Perjalanan Anda</h1>
            <p class="text-on-surface-variant max-w-xl mx-auto" id="page-subtitle">Peta waktu lengkap dari langkah-langkah strategis menuju profesi impian Anda.</p>
        </div>

        <!-- Timeline Container -->
        <div class="relative" id="timeline-container">
            <!-- Vertical line -->
            <div class="absolute left-5 md:left-1/2 top-0 bottom-0 w-0.5 bg-gradient-to-b from-secondary via-primary/30 to-primary/10 md:-translate-x-px"></div>
        </div>
    </main>

    <script>
    function renderTimeline(timelineData, careerTitle) {
        const container = document.getElementById('timeline-container');
        if (!container) return;

        let html = '<div class="absolute left-5 md:left-1/2 top-0 bottom-0 w-0.5 bg-gradient-to-b from-secondary via-primary/30 to-primary/10 md:-translate-x-px"></div>';

        timelineData.forEach((item, index) => {
            const isLeft = index % 2 === 0;
            const statusColors = {
                'active': { dot: 'bg-emerald-500 pulse-dot', badge: 'bg-emerald-500 text-white', text: 'Sedang Berjalan' },
                'upcoming': { dot: 'bg-primary/30', badge: 'bg-primary/10 text-primary', text: 'Akan Datang' },
                'optional': { dot: 'bg-secondary border-2 border-dashed border-secondary', badge: 'bg-secondary/10 text-secondary', text: 'Opsional' }
            };
            const status = statusColors[item.status] || statusColors['upcoming'];

            html += `
            <div class="timeline-item relative flex items-start mb-8 md:mb-12 ${isLeft ? 'md:flex-row' : 'md:flex-row-reverse'}" style="transition-delay: ${index * 120}ms">
                <div class="absolute left-5 md:left-1/2 w-4 h-4 rounded-full ${status.dot} border-4 border-[#EAEDE2] z-10 -translate-x-1/2 mt-6"></div>
                <div class="ml-12 md:ml-0 ${isLeft ? 'md:pr-12 md:w-1/2 md:text-right' : 'md:pl-12 md:w-1/2'}">
                    <div class="bg-white border border-primary/15 p-6 hard-shadow hover:translate-y-[-2px] hover:shadow-[6px_6px_0_0_#020b24] transition-all duration-300 group">
                        <div class="flex items-center gap-3 mb-3 ${isLeft ? 'md:flex-row-reverse' : ''}">
                            <div class="w-10 h-10 rounded-lg bg-primary/5 flex items-center justify-center shrink-0 group-hover:bg-secondary/10 transition-colors">
                                <span class="material-symbols-outlined text-primary group-hover:text-secondary transition-colors">${item.icon || 'school'}</span>
                            </div>
                            <div class="${isLeft ? 'md:text-right' : ''}">
                                <h3 class="font-bold text-primary text-lg">${item.year}</h3>
                                <span class="font-mono text-[11px] ${status.badge} px-2 py-0.5 rounded-full">${item.label} · ${status.text}</span>
                            </div>
                        </div>
                        <p class="text-on-surface-variant text-sm leading-relaxed">${item.desc}</p>
                    </div>
                </div>
            </div>`;
        });

        container.innerHTML = html;

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.15 });
        container.querySelectorAll('.timeline-item').forEach(item => observer.observe(item));
    }

    function applyTimeline(careerTitle, jenjang, kelas) {
        const store = window.CareerRoadmapStore;
        if (!store) return;

        const roadmap = store.getCareerRoadmap(careerTitle, jenjang, kelas);

        document.title = `Timeline Perjalanan: ${roadmap.title} | Flexa Cendekia`;
        
        const elTitle = document.getElementById('page-title');
        if (elTitle) elTitle.textContent = 'Timeline: Jalur ' + roadmap.title;

        const elSubtitle = document.getElementById('page-subtitle');
        if (elSubtitle) elSubtitle.textContent = 'Peta waktu strategis 6 tahun untuk meraih cita-cita ' + roadmap.title + ' profesional.';

        renderTimeline(roadmap.timeline, roadmap.title);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const careerTitle = localStorage.getItem('selectedCareer') || 'Arsitek';
        applyTimeline(careerTitle);
    });

    window.addEventListener('auth-ready', function(e) {
        const user = e.detail;
        if (user) {
            const careerFromDb = user.citaCita || localStorage.getItem('selectedCareer') || 'Arsitek';
            localStorage.setItem('selectedCareer', careerFromDb);
            applyTimeline(careerFromDb, user.jenjang, user.kelas);
        }
    });
    </script>

<!-- Dynamic Student Data Hydration Script -->
<script>
(function() {
    function hydrateStudentData(user) {
        if (!user) return;
        const nama = user.nama || localStorage.getItem('userNama') || 'Siswa Flexa';
        const jenjang = (user.jenjang || localStorage.getItem('userJenjang') || 'SD').toUpperCase();
        const kelas = user.kelas || localStorage.getItem('userKelas') || (jenjang === 'SD' ? '1' : (jenjang === 'SMP' ? '7' : '10'));
        const fotoUrl = user.fotoUrl || user.avatar || localStorage.getItem('userAvatar') || '';

        // Update all display names
        document.querySelectorAll('.user-display-name, #user-name-display, #sidebar-user-name, #top-user-name').forEach(el => {
            if (el) el.textContent = nama;
        });

        // Update jenjang & kelas displays
        document.querySelectorAll('.user-jenjang-display, #sidebar-user-jenjang').forEach(el => {
            if (el) el.textContent = `Jenjang ${jenjang} • Kelas ${kelas}`;
        });

        // Update Avatars
        const initials = nama.split(' ').filter(Boolean).map(n => n[0]).slice(0, 2).join('').toUpperCase() || 'SW';
        ['sidebar-user-avatar', 'top-user-avatar', 'user-avatar-badge', 'hero-user-avatar'].forEach(id => {
            const av = document.getElementById(id);
            if (av) {
                if (fotoUrl) {
                    av.innerHTML = `<img src="${fotoUrl}" class="w-full h-full object-cover rounded-full" />`;
                } else {
                    av.textContent = initials;
                }
            }
        });
    }

    // Auto-run on DOM ready from localStorage
    document.addEventListener('DOMContentLoaded', function() {
        try {
            const cached = JSON.parse(localStorage.getItem('currentUser') || '{}');
            if (cached && (cached.nama || cached.email)) {
                hydrateStudentData(cached);
            }
        } catch(e) {}
    });

    // Listen to Firebase Auth Ready
    window.addEventListener('auth-ready', function(e) {
        if (e && e.detail) {
            hydrateStudentData(e.detail);
        }
    });
})();
</script>

</body>
</html>
